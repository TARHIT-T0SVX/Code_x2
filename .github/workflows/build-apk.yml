name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi
          
          RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Raw version line: $RAW_VERSION"
          
          # Extract major version
          MAJOR_VERSION=$(echo "$RAW_VERSION" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version from '$RAW_VERSION'"
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version must be 17 or higher (detected $MAJOR_VERSION)"
            exit 1
          fi
          echo "Java version requirement satisfied (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to verify ./debug.keystore creation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK with Gradle 9.3.1 ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file is empty ($EXPECTED_APK)"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "Verified debug APK: $EXPECTED_APK"
          echo "APK File size: $APK_SIZE bytes"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk_release_staging"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset $ASSET_PATH is missing or empty."
            exit 1
          fi
          
          echo "Asset filename: $ASSET_NAME"
          echo "Asset path: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Validating GitHub CLI and Release Asset ==="
          gh --version
          
          RELEASE_ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Release asset $RELEASE_ASSET_PATH is invalid or missing."
            exit 1
          fi
          
          if [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset must have .apk extension."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          - **Build Type:** Debug APK (Testing Build)
          - **GitHub Actions Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Target Commit SHA:** \`${{ github.sha }}\`
          - **Built By:** GitHub Actions (\`${{ github.workflow }}\`)

          > **Note:** This APK is automatically built and signed with a temporary debug keystore for testing and verification purposes. It is not intended for Google Play Store production distribution.

          #### 📥 Download Instructions:
          Download **\`${RELEASE_ASSET_NAME}\`** directly from the Assets list below to install and test on your Android device.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Summary & Release Status Report ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "GitHub Release created successfully!"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $RELEASE_NAME"
            
            echo "## 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Build Succeeded:** \`app-debug.apk\` was successfully compiled." >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **GitHub Release:** [$RELEASE_TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "📥 **Direct Download:** Download \`$RELEASE_NAME\` directly from the [Release Page Assets]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "💾 **Actions Artifact:** The build artifact \`app-debug-apk\` is also available under the workflow run summary as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was built successfully and is preserved as an Actions artifact."
            
            echo "## ⚠️ Debug APK Build Summary (Artifact Only)" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **Build Succeeded:** \`app-debug.apk\` was successfully compiled." >> "$GITHUB_STEP_SUMMARY"
            echo "💾 **Download Available:** The APK artifact **\`app-debug-apk\`** is available for download in the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ *GitHub Release publishing encountered an issue or was skipped; your APK artifact remains fully accessible.*" >> "$GITHUB_STEP_SUMMARY"
          fi
